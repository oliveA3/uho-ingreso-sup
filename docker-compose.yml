# Servicios de infraestructura para desarrollo local: PostgreSQL 14+ y Redis 7+.
# Uso:  cp .env.example .env   (y edita las contraseñas)   →   docker compose up -d
# El backend y el frontend se siguen ejecutando en el equipo (python manage.py runserver / npm run dev).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ingresosup}
      POSTGRES_USER: ${DB_USER:-ingresosup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ingresosup} -d ${DB_NAME:-ingresosup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
